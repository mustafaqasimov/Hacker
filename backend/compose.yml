name: hacktrain
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hacktrain
      POSTGRES_USER: hacktrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hacktrain -d hacktrain"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
  migrate:
    build: .
    entrypoint: [java, -jar, /app/migrator.jar]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hacktrain
      DB_USER: hacktrain
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_STUDENT_DAILY_LIMIT: ${AI_STUDENT_DAILY_LIMIT:-30}
      AI_ORGANIZATION_DAILY_LIMIT: ${AI_ORGANIZATION_DAILY_LIMIT:-1000}
      DB_URL: jdbc:postgresql://postgres:5432/hacktrain
      DB_USER: hacktrain_runtime
      DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["127.0.0.1:8081:8080"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 150
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://localhost:9091/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [data, ops, edge]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    networks: [ops]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [ops, edge]
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
networks:
  edge:
  data:
    internal: true
  ops:
    internal: true
