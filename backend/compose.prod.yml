name: hacktrain-backend-prod
services:
  migrate:
    build: .
    image: hacktrain-backend:local
    entrypoint: [java, -jar, /app/migrator.jar]
    environment:
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USER: ${MIGRATION_DB_USER:?Set MIGRATION_DB_USER}
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
  app:
    image: hacktrain-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      AI_STUDENT_DAILY_LIMIT: ${AI_STUDENT_DAILY_LIMIT:-30}
      AI_ORGANIZATION_DAILY_LIMIT: ${AI_ORGANIZATION_DAILY_LIMIT:-1000}
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8081}:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 150
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://localhost:9091/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
